services:
  - type: web
    name: ingrex
    runtime: python
    plan: free
    buildCommand: "true"          # stdlib only, nothing to install
    startCommand: python3 ingrex.py
    envVars:
      - key: HOST
        value: 0.0.0.0
    # ponytail: no disk attached, so ratings reset on each deploy/restart.
    # Add a Render disk mounted at /data + DB=/data/ingrex.db when feedback must persist.
