services:
  - type: web
    name: ingrex
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt   # psycopg2 for Postgres
    startCommand: python3 ingrex.py
    envVars:
      - key: HOST
        value: 0.0.0.0
    # Durable data: set DATABASE_URL to your Supabase/Neon Postgres connection
    # string (use the pooled connection). Also set INGREX_ADMIN_CODE and
    # INGREX_SECRET. With DATABASE_URL unset the app falls back to ephemeral SQLite.
